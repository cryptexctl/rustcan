[package]
name = "rustcan"
version = "0.2.0"
edition = "2024"
authors = ["Lain Iwakura <lain@iwakurahome.ru>"]
description = "A fast port scanner written in Rust, inspired by Nmap and Masscan"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.11"
async-trait = "0.1"
regex = "1.12"
futures = "0.3"
crossbeam-channel = "0.5"
base64 = "0.22"
chrono = "0.4"
ipnetwork = "0.21"
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
lazy_static = "1.5"
